<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project.">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="skuu">
    <link rel="apple-touch-icon" href="icons/icon-1024.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
    <!-- 配合本地 Roboto（见 pubspec fonts + assets/fonts/）可减少引擎对 Roboto 的远程拉取 -->
    <meta name="flutter-font" content="disable">
    <!-- Noto 等回退字体基址见 web/flutter_bootstrap.js（默认 fonts.gstatic.cn）；可先于 bootstrap 设置 window.__qqaiFontFallbackBaseUrl -->
  <link rel="preload" href="main.dart.js" as="script">

    <!-- 需要 CDN 字体时：先改好 web/fonts_cdn.css 里的 URL，再取消下一行注释。 -->
    <link rel="stylesheet" href="fonts_cdn.css">

    <title>千千Ai</title>
    <link rel="manifest" href="manifest.json">

    <style>
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
        }

        .loader {
            border: 16px solid #f3f3f3;
            border-radius: 50%;
            border: 15px solid;
            border-top: 16px solid blue;
            border-right: 16px solid white;
            border-bottom: 16px solid blue;
            border-left: 16px solid white;
            width: 120px;
            height: 120px;
            -webkit-animation: spin 2s linear infinite;
            animation: spin 2s linear infinite;
        }

        @-webkit-keyframes spin {
            0% {
                -webkit-transform: rotate(0deg);
            }
            100% {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div class="loading">
    <div class="loader"></div>
</div>
<!-- 海外部署：取消注释以改回国际 gstatic 作为回退字体源 -->
<!-- <script>window.__qqaiFontFallbackBaseUrl = 'https://fonts.gstatic.com/s/';</script> -->
<!-- KaTeX 等依赖包字体走 /assets/packages/...；要从 CDN 拉时，在下一行填写 build/web 所在 CDN 根 URL（以 / 结尾） -->
<!-- <script>window.__qqaiAssetBase = 'https://你的CDN/与 build/web 对齐的路径/';</script> -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
