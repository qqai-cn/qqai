<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="千千AI">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="skuu">
    <link rel="apple-touch-icon" href="icons/icon-512.png">

    <!-- Favicon -->
    <!--  <link rel="icon" type="image/png" href="favicon.png"/>-->
    <!-- Favicon package generated by Favicon.im Generator -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <meta name="theme-color" content="#0175C2">
    <!-- Wasm 首屏关键路径：与 skwasm 并行预载（须 crossorigin） -->
    <link rel="modulepreload" href="main.dart.mjs">
    <link rel="preload" href="main.dart.wasm" as="fetch" type="application/wasm" crossorigin>    <title>千千Ai</title>    <link rel="manifest" href="manifest.json">

    <style>
        html,
        body {
            overscroll-behavior-x: none;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
        }

        .loader {
            border: 16px solid #f3f3f3;
            border-radius: 50%;
            border: 15px solid;
            border-top: 16px solid blue;
            border-right: 16px solid white;
            border-bottom: 16px solid blue;
            border-left: 16px solid white;
            width: 120px;
            height: 120px;
            -webkit-animation: spin 2s linear infinite;
            animation: spin 2s linear infinite;
        }

        @-webkit-keyframes spin {
            0% {
                -webkit-transform: rotate(0deg);
            }
            100% {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div id="loading" class="loading">
    <div class="loader"></div>
</div>
<script>
    window.addEventListener('flutter-first-frame', function () {
        document.getElementById('loading')?.remove();
    });
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
