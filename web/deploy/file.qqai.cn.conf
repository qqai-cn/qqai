# =============================================================================
# file.qqai.cn — secure_link + Referer
# Java: base64url( md5_binary(expires + uri + " " + secret) )
# Nginx: secure_link_md5 "$secure_link_expires$uri Wmd0c8BfvbqkbRwTG971";
# =============================================================================

map $http_referer $invalid_referer {
    default                     1;
    ""                          0;
    "~^$"                        0;
    "~^https://(www\.)?qqai\.cn(/|$)"              0;
    "~^https://([a-z0-9-]+\.)*qqai\.cn(/|$)"       0;
    "~^http://localhost(:\d+)?(/|$)"               0;
}

# fetch / canvas 跨域读像素需要 CORS；普通 <img>/<video> 不需要
map $http_origin $cors_allow_origin {
    default                                     "";
    "~^https://(www\.)?qqai\.cn$"                 $http_origin;
    "~^https://([a-z0-9-]+\.)*qqai\.cn$"          $http_origin;
    "~^http://localhost(:\d+)?$"                   $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name file.qqai.cn www.file.qqai.cn;
    return 301 https://file.qqai.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name file.qqai.cn www.file.qqai.cn;

    ssl_certificate     /etc/nginx/ssl/file.qqai.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/file.qqai.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /qqai/files;
    charset utf-8;
    autoindex off;

    location ~ /\. { deny all; }

    # 用 prefix location，避免 regex + if + secure_link 组合异常
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        secure_link $arg_token,$arg_e;
        secure_link_md5 "$secure_link_expires$uri Wmd0c8BfvbqkbRwTG971";

        if ($secure_link = "0") { return 410; }
        if ($secure_link = "") { return 403; }

        if ($invalid_referer = 1) { return 403; }

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header Vary Origin always;
        add_header Accept-Ranges bytes always;
        sendfile on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }
}
