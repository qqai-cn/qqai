# =============================================================================
# qqai.cn — Flutter Web (Wasm/skwasm) + Spring Boot API
#
# 部署步骤：
#   cd qqai && ./build_web_wasm.sh
#   export WEB_DEPLOY_TARGET='root@server:/var/www/qqai/web/'
#   ./web/deploy/deploy_web.sh
#   服务器: nginx -t && nginx -s reload
#   校验: bash web/deploy/verify_web_gzip.sh https://qqai.cn
#
# gzip_static 需要 nginx 含 http_gzip_static_module（nginx -V | grep gzip_static）
# =============================================================================

upstream qqai_backend {
    server 127.0.0.1:58080;
    keepalive 32;
}

upstream qqai_socketio {
    server 127.0.0.1:59092;
    keepalive 8;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name qqai.cn www.qqai.cn;

    return 301 https://qqai.cn$request_uri;
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.qqai.cn;

    ssl_certificate     /etc/nginx/ssl/qqai.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/qqai.cn/privkey.pem;

    return 301 https://qqai.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qqai.cn;

    # --- TLS（按实际证书路径修改）---
    ssl_certificate     /etc/nginx/ssl/qqai.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/qqai.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:QQAI_SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # --- 站点根：flutter build/web 输出目录 ---
    root /var/www/qqai/web;
    index index.html;

    charset utf-8;
    client_max_body_size 100m;

    # --- 压缩：须同时存在 main.dart.wasm 与 main.dart.wasm.gz，gzip_static 才生效 ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_http_version 1.1;
    gzip_types
        application/wasm
        application/javascript
        text/javascript
        text/css
        application/json
        application/xml
        application/font-woff
        application/font-woff2
        font/ttf
        font/otf
        image/svg+xml;

    # brotli on;
    # brotli_comp_level 6;
    # brotli_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml;

    # --- 安全头（WebAssembly + skwasm 需同源）---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================================================================
    # 后端 API（与 qqai-boot application-prod.yaml port 58080 一致）
    # =========================================================================

    location ^~ /app-api/ {
        proxy_pass http://qqai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /admin-api/ {
        proxy_pass http://qqai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Socket.IO（qqai.socket-io.port=59092；后管 VITE_SOCKET_IO_URL 可与 API 同域）
    location ^~ /socket.io/ {
        proxy_pass http://qqai_socketio/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =========================================================================
    # Flutter Web 静态资源
    # =========================================================================

    # 入口 HTML / bootstrap：发版后立即生效，禁止长缓存
    location = /index.html {
        gzip_static on;
        # brotli_static on;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /flutter_bootstrap.js {
        gzip_static on;
        # brotli_static on;
        add_header Cache-Control "no-cache" always;
    }

    location = /flutter_service_worker.js {
        gzip_static on;
        add_header Cache-Control "no-cache" always;
    }

    location = /version.json {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    # Wasm：优先 .gz（约 2.4MB），无 .gz 时回退动态 gzip
    location = /main.dart.wasm {
        default_type application/wasm;
        gzip on;
        gzip_static on;
        gzip_vary on;
        gzip_types application/wasm;
        # brotli on;
        # brotli_static on;
        # brotli_types application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        gzip on;
        gzip_static on;
        gzip_vary on;
        gzip_types application/wasm;
        # brotli on;
        # brotli_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ~* \.mjs$ {
        default_type text/javascript;
        gzip on;
        gzip_static on;
        gzip_vary on;
        gzip_types text/javascript application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.js$ {
        gzip on;
        gzip_static on;
        gzip_vary on;
        gzip_types text/javascript application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # CanvasKit / skwasm 引擎（与 build --no-web-resources-cdn 配套）
    location ^~ /canvaskit/ {
        gzip on;
        gzip_static on;
        gzip_vary on;
        gzip_types application/wasm application/javascript text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Flutter assets（/assets/...，含字体）
    location ^~ /assets/ {
        gzip on;
        gzip_static on;
        gzip_vary on;
        gzip_types font/ttf font/otf application/font-woff application/font-woff2;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 其它静态扩展名
    location ~* \.(?:css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|otf|json)$ {
        gzip on;
        gzip_static on;
        gzip_types font/ttf font/otf application/font-woff application/font-woff2;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA 路由（GoRouter 深链）；排除已存在的物理文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
