# 临时调试：替换 file.qqai.cn.conf 后 reload，看响应头 X-Secure-Link / X-Invalid-Referer
# 验签通过后改回正式配置

map $http_referer $invalid_referer {
    default 1;
    "" 0;
    "~^https://(www\.)?qqai\.cn(/|$)" 0;
    "~^https://([a-z0-9-]+\.)*qqai\.cn(/|$)" 0;
}

map $http_origin $cors_allow_origin {
    default "";
    "~^https://(www\.)?qqai\.cn$" $http_origin;
    "~^https://([a-z0-9-]+\.)*qqai\.cn$" $http_origin;
}

server {
    listen 443 ssl;
    http2 on;
    server_name file.qqai.cn www.file.qqai.cn;
    ssl_certificate     /etc/nginx/ssl/file.qqai.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/file.qqai.cn.key;
    root /qqai/files;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
            return 204;
        }

        secure_link $arg_token,$arg_e;
        secure_link_md5 "$secure_link_expires$uri Wmd0c8BfvbqkbRwTG971";

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header X-Secure-Link $secure_link always;
        add_header X-Invalid-Referer $invalid_referer always;
        add_header X-Uri $uri always;
        add_header X-Arg-E $arg_e always;

        if ($secure_link = "0") { return 410; }
        if ($secure_link = "") { return 403; }
        if ($invalid_referer = 1) { return 403; }

        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name file.qqai.cn www.file.qqai.cn;
    return 301 https://$host$request_uri;
}
